---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language:
polling_url: https://trmnl-plugins-prod.lucasp.net/api/v2/forecast?place={{ place | url_encode }}&latitude={{ latitude }}&longitude={{ longitude }}&units={{ units }}&hours={{ hours }}&days={{ days }}&time_format={{ time_format }}
polling_headers: ''
polling_body: ''
id: 249564
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: doesnt_matter
  field_type: author_bio
  name: LP Weather
  description: Another weather plugin. Shows current conditions, hourly and daily forecasts.
  category: environment,custom
  github_url: https://github.com/lucaspimentel/trmnl-plugins
  learn_more_url: https://github.com/lucaspimentel/trmnl-plugins/tree/main/plugins/weather/README.md
- keyname: place
  field_type: string
  name: Location
  description: City, postal code, or 'latitude, longitude' (latitude first). Blank uses your saved Latitude and Longitude. Postal codes are not unique across countries (75001 is Paris, France; add ', US' for Addison, TX). Swapped coordinates silently show the wrong place.
  placeholder: 'Boston, MA'
- keyname: latitude
  field_type: number
  name: Latitude
  min: -90
  max: 90
  step: any
- keyname: longitude
  field_type: number
  name: Longitude
  min: -180
  max: 180
  step: any
- keyname: units
  field_type: select
  name: Units
  description: imperial (°F, mph) or metric (°C, km/h)
  default: imperial
  options:
  - imperial
  - metric
- keyname: hours
  field_type: number
  name: Hours
  description: Number of hours to show in the Hourly forecast
  placeholder: '25'
  default: 25
  min: 1
  max: 25
  step: 1
- keyname: days
  field_type: number
  name: Days
  description: Number of days to show in the Daily forecast, including today. Pirate Weather only supplies up to 7 days regardless of this setting.
  placeholder: '6'
  default: 6
  min: 1
  max: 14
  step: 1
- keyname: time_format
  field_type: select
  name: Time Format
  description: 12-hour (am/pm) or 24-hour clock for times
  default: 12h
  options:
  - 12h
  - 24h
name: LP Weather
description: 'Weather: current, hourly, daily'
refresh_interval: 60
