oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: doesnt_matter
  field_type: author_bio
  name: LP Weather
  description: Another weather plugin. Shows current conditions, hourly and daily forecasts.
  category: environment,custom
  github_url: https://github.com/lucaspimentel/trmnl-plugins
  learn_more_url: https://github.com/lucaspimentel/trmnl-plugins/tree/main/plugins/weather/README.md
- keyname: place
  field_type: string
  name: Location
  description: "Enter a city, a postal code, or a 'latitude, longitude' pair (latitude first). This replaces the old Latitude and Longitude fields below, which are only used while this is left blank. Narrow an ambiguous name with a state or country after a comma: 'Portland, ME', 'Munich, DE', 'Toronto, Canada'. Two things to watch: postal codes are not unique across countries (75001 is Paris, France; add ', US' for Addison, TX), and swapped coordinates silently show the wrong place. The screen shows the location it matched, so you can check it there after saving."
  optional: true
  placeholder: 'Boston, MA'
- keyname: country
  field_type: select
  name: Country
  description: "Your country, used only to settle an ambiguous Location. A bare postal code is rarely unique: 02180 is a real code in six countries, and 75001 is both central Paris and Addison, Texas. Left on Auto, the busiest match wins, which is not always yours. Setting this never overrides a country you typed into Location yourself, and never stops a location abroad from working, so you can still look up another country's weather."
  default: Auto
  options:
  - Auto
  - AF - Afghanistan
  - AX - Aland
