- keyname: latitude
  field_type: number
  name: Latitude
  description: "Deprecated: use the Location field above instead. Move your location there, either as a city or postal code or as a 'latitude, longitude' pair, then clear this field. It is only used while Location is blank, and will be removed in a future update."
  optional: true
  min: -90
  max: 90
  step: any
- keyname: longitude
  field_type: number
  name: Longitude
  description: "Deprecated: use the Location field above instead. Move your location there, either as a city or postal code or as a 'latitude, longitude' pair, then clear this field. It is only used while Location is blank, and will be removed in a future update."
  optional: true
  min: -180
  max: 180
  step: any
- keyname: units
  field_type: select
  name: Units
  description: imperial (°F, mph) or metric (°C, km/h)
  default: imperial
  options:
  - imperial
  - metric
- keyname: hours
  field_type: number
  name: Hours
  description: Number of hours to show in the Hourly forecast
  placeholder: '25'
  default: 25
  min: 1
  max: 25
  step: 1
- keyname: days
  field_type: number
  name: Days
  description: Number of days to show in the Daily forecast, including today. Pirate Weather only supplies up to 7 days regardless of this setting.
  placeholder: '6'
  default: 6
  min: 1
  max: 14
  step: 1
- keyname: time_format
  field_type: select
  name: Time Format
  description: 12-hour (am/pm) or 24-hour clock for times
  default: 12h
  options:
  - 12h
  - 24h
- keyname: show_place
  field_type: select
  name: Show Location
  description: "Append the location the API matched to the plugin name in the title bar, as in 'LP Weather - Boston, MA'. The name itself is yours to change (the Name field at the top of this page), so you can set it to your city and turn this off. Worth leaving on at least once: a city name or postal code can quietly match somewhere else entirely, and this is how you would notice."
  default: 'yes'
  options:
  - 'yes'
  - 'no'
name: LP Weather
description: 'Weather: current, hourly, daily'
refresh_interval: 60
