name: tests

on:
  push:
    branches: [main, staging]
    paths:
      - 'api/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TrmnlApi.slnx

      - name: Build
        run: dotnet build TrmnlApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TrmnlApi.slnx --configuration Release --no-build --verbosity normal

      # Builds from api/ so a Dockerfile break fails here instead of at deploy time.
      - name: Docker build
        run: docker build -f Dockerfile .
