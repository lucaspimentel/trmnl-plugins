name: tests

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TrmnlApi.slnx

      - name: Build
        run: dotnet build TrmnlApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TrmnlApi.slnx --configuration Release --no-build --verbosity normal

      # Builds from api/ so a Dockerfile break fails here instead of at deploy time.
      - name: Docker build
        run: docker build -f Dockerfile .
