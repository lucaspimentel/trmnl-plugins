name: tools

# No other workflow's paths match tools/**, so without this a dependency bump that breaks
# Trmnl.Cli, or a broken helper script, would merge green.

on:
  push:
    branches: [main, staging]
    paths:
      - 'tools/**'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/tools.yml'

jobs:
  build-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/Trmnl.Cli
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Trmnl.Cli has no tests; this proves it compiles. Directory.Build.props sets
      # TreatWarningsAsErrors, so a package with a known vulnerability also fails here.
      # Debug, not Release: ImageSharp 4.1+ fails a Release build with no Six Labors license,
      # but only warns in Debug (ContinueOnError on Debug configurations in its .targets).
      - name: Build
        run: dotnet build Trmnl.Cli.csproj --configuration Debug

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Info-level findings are excluded: SC2016 flags setup-env.sh's single-quoted lines,
      # which are written to the env file unexpanded on purpose.
      - name: shellcheck
        run: shellcheck --severity=warning tools/*.sh

      # Write-Host is excluded: these are interactive scripts and the host output is the point.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path tools -Recurse -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize | Out-String -Width 200
          if ($results) { exit 1 }
